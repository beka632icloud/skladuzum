<style>
:root{
  --bg:#F4F0FF; --surface:#FFFFFF; --surface2:#EFE9FF; --ink:#1C1238; --muted:#6D6590; --line:#E3DBF7;
  --brand:#6A2CFF; --brand-ink:#FFFFFF; --brand-soft:#E9DFFF; --cyan:#00CFFF; --hero-a:#00CFFF; --hero-b:#7700FF;
  --danger:#D92D4B; --danger-soft:#FDE8EC; --ok:#12805C; --ok-soft:#DDF5EC; --amber:#8A5300; --amber-soft:#FFF0D1;
  --scrim:rgba(28,18,56,.5);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#100A20; --surface:#1A1230; --surface2:#231A40; --ink:#F0EBFF; --muted:#A99FCC; --line:#2E2452;
    --brand:#7B4BFF; --brand-ink:#FFFFFF; --brand-soft:#2B1F52; --cyan:#00CFFF; --hero-a:#0A8FBF; --hero-b:#5A12C8;
    --danger:#FF7A90; --danger-soft:#3A1822; --ok:#4FD1A1; --ok-soft:#12302A; --amber:#FFC266; --amber-soft:#33260E;
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#100A20; --surface:#1A1230; --surface2:#231A40; --ink:#F0EBFF; --muted:#A99FCC; --line:#2E2452;
  --brand:#7B4BFF; --brand-ink:#FFFFFF; --brand-soft:#2B1F52; --cyan:#00CFFF; --hero-a:#0A8FBF; --hero-b:#5A12C8;
  --danger:#FF7A90; --danger-soft:#3A1822; --ok:#4FD1A1; --ok-soft:#12302A; --amber:#FFC266; --amber-soft:#33260E;
  --scrim:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;line-height:1.4;font-weight:500}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
.app{max-width:820px;margin:0 auto;min-height:100vh}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 14px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--cyan),var(--brand) 60%,transparent)}
.top .logo{width:32px;height:32px;border-radius:9px;flex:none;display:block;box-shadow:0 2px 6px rgba(80,0,180,.18)}
.top .ttl{flex:1;min-width:0}
.top .ttl h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;min-height:40px}
.pill:hover{border-color:var(--brand)}
.icb{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);flex:none}
.icb:hover{border-color:var(--brand)}
.icb[disabled]{opacity:.4;cursor:default}
.main{padding:16px 14px 110px}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:10px 12px;margin:0 0 14px;font-weight:700;display:flex;justify-content:space-between;gap:10px;align-items:center}
.banner button{border:0;background:none;color:inherit;text-decoration:underline;font-weight:800;padding:0}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:10px 6px 9px;color:var(--muted);font-weight:700;font-size:13px}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"] svg{stroke-width:2.4}

/* hero */
.hero{background:var(--brand);color:var(--brand-ink);border-radius:22px;padding:20px;display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:14px}
.hero .lab{font-weight:700;opacity:.85}
.hero .num{font-size:54px;line-height:1;font-weight:800;letter-spacing:-.03em;margin:6px 0 12px}
.splitbar{height:10px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.splitbar span{display:block;height:100%;background:#fff;border-radius:99px}
.hero .sp{display:flex;gap:16px;margin-top:10px;font-weight:700;font-size:14px}
.hero .sp b{font-weight:800}
.hero .side{border-left:1.5px solid rgba(255,255,255,.3);padding-left:18px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero .side b{display:block;font-size:30px;line-height:1.05;font-weight:800}
.hero .side span{font-size:13px;font-weight:700;opacity:.9}
@media (max-width:420px){.hero{grid-template-columns:1fr}.hero .side{border-left:0;padding-left:0;flex-direction:row;gap:26px;border-top:1.5px solid rgba(255,255,255,.3);padding-top:14px}.hero .num{font-size:46px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.card h2{font-size:17px;margin-bottom:10px}
.low-card{border-color:var(--danger);}
.low-card h2{color:var(--danger)}
.lowrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-weight:700}
.lowrow:first-of-type{border-top:0}
.lowrow span:last-child{color:var(--danger)}
.hint{color:var(--muted);font-size:13px;font-weight:600}

.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 8px;font-weight:700;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 0 0 1.5px var(--brand) inset}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
label.f{display:block;margin-bottom:12px;font-weight:700;font-size:13.5px;color:var(--muted)}
label.f>input,label.f>select{margin-top:5px;color:var(--ink);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:800;min-height:46px;background:var(--brand);color:var(--brand-ink)}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.sec:hover{border-color:var(--brand)}
.btn.danger{background:var(--danger);color:#fff}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:8px 12px;border-radius:11px;font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>.btn{flex:1}
.link{border:0;background:none;color:var(--brand);font-weight:800;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}

.exports{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.exports .pill{font-size:14px;padding:7px 12px;min-height:38px}

/* stock table */
.grp{margin-bottom:14px}
.grp>h3{font-size:16px;padding:6px 4px}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.trow{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);position:relative}
.trow.thead{border-top:0;background:var(--surface2);color:var(--muted);font-size:12.5px;font-weight:700;padding-top:7px;padding-bottom:7px}
.trow span:nth-child(n+2),.trow b{text-align:right;font-variant-numeric:tabular-nums}
.trow.thead span:first-child{text-align:left}
.trow.low{background:var(--danger-soft)}
.trow.low::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--danger)}
.trow .sz{font-weight:800}
.tag{font-style:normal;font-size:11.5px;font-weight:800;color:var(--danger);background:var(--danger-soft);border:1px solid var(--danger);border-radius:99px;padding:1px 7px;margin-left:7px}
.trow.low .tag{background:transparent}

/* edit rows */
.tools{display:flex;gap:8px;margin-bottom:10px}
.ops{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 16px}
@media (min-width:560px){.ops{grid-template-columns:repeat(4,1fr)}}
.erow{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;position:relative}
.erow.low{border-color:var(--danger)}
.ehead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ehead .sz{font-weight:800;font-size:16px}
.ehead .code{color:var(--muted);font-size:12.5px;font-weight:600;margin-left:auto}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{background:var(--surface2);border-radius:13px;padding:8px 10px}
.step .sl{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.sc{display:flex;align-items:center;justify-content:space-between;gap:6px}
.sv{font-size:22px;font-weight:800;min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.sb{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.sb.plus{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.sb:active{transform:scale(.94)}
.bagbox h2{font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1.5px solid var(--brand);background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:5px 10px;font-weight:800;min-height:34px}
.chip.u{background:transparent;border-style:dashed}
.chip.iss{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}

/* journal */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.filters button{white-space:nowrap;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-weight:700;min-height:38px}
.filters button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.le{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px}
.le .l1{font-weight:800}
.le .l2{margin-top:2px}
.le .l3{color:var(--muted);font-size:13px;font-weight:600;margin-top:3px}
.le.undone .l1,.le.undone .l2{text-decoration:line-through;opacity:.6}
.le .pos{color:var(--ok);font-weight:800}.le .neg{color:var(--danger);font-weight:800}
.le img{display:block;margin-top:8px;max-width:120px;max-height:90px;border-radius:10px;border:1px solid var(--line)}
.le .badge{font-size:11.5px;font-weight:800;border-radius:99px;padding:1px 8px;background:var(--surface2);color:var(--muted);margin-left:6px;text-decoration:none;display:inline-block}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-weight:600}

/* sheets */
.sheet-back{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 8px}
.sheet-h h2{font-size:19px}
.sheet-b{padding:6px 16px 12px;overflow:auto;flex:1}
.sheet-f{padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-f .btn{flex:1}
.lines{margin:6px 0 12px}
.ln{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:6px;font-weight:700}
.ln .grow small{display:block;color:var(--muted);font-weight:600}
.ln b{font-size:18px}
.err{color:var(--danger);font-weight:700;margin:6px 0 0;min-height:18px}
.inv .ir{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.inv .ir input{padding:8px;min-height:40px;text-align:center}
.inv .ir small{display:block;color:var(--muted);font-weight:600}
.ce .cr{display:grid;grid-template-columns:1.3fr .9fr .8fr .5fr 40px;gap:5px;align-items:center;margin-bottom:6px}
.ce .cr input{padding:8px;min-height:40px}
.ce .ch{color:var(--muted);font-size:12px;font-weight:700}
video{width:100%;border-radius:14px;background:#000;max-height:50vh}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:80;max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger);color:#fff}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}

/* auth */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 18px;max-width:440px;margin:0 auto}
.auth .brand{position:relative;overflow:hidden;isolation:isolate;text-align:center;background:linear-gradient(145deg,var(--hero-a) 0%,var(--hero-b) 62%);color:var(--brand-ink);border-radius:28px;padding:30px 22px 26px;margin-bottom:14px;box-shadow:0 14px 34px -14px rgba(90,0,200,.55)}
.auth .brand::before{content:"";position:absolute;z-index:-1;width:300px;height:300px;right:-110px;bottom:-150px;background:rgba(255,255,255,.13);border-radius:58% 42% 50% 50% / 40% 46% 54% 60%;transform:rotate(-18deg)}
.auth .brand::after{content:"";position:absolute;z-index:-1;width:150px;height:150px;left:-60px;top:-70px;background:rgba(255,255,255,.10);border-radius:50% 50% 46% 54% / 60% 44% 56% 40%}
.auth .brand .logo{display:block;width:104px;height:104px;margin:0 auto 16px;border-radius:26px;box-shadow:0 10px 24px rgba(30,0,90,.35),0 0 0 4px rgba(255,255,255,.22)}
.auth .brand h1{font-size:40px;letter-spacing:-.03em}
.auth .brand p{margin:6px 0 0;font-weight:600;opacity:.92}
.auth .demo{font-size:13px;color:var(--muted);font-weight:600;margin-top:12px;line-height:1.7}

.users .u{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.u .uh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.u .uh b{font-size:16px}
.st{font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.bl{background:var(--danger-soft);color:var(--danger)}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);margin:18px 4px 8px}
</style>
</head>

/* ---------- catalog / data ---------- */
var SIZES=['S','M','L','XL','2XL','3XL','4XL'];
function defaultCatalog(){
  var c=[];
  SIZES.forEach(function(s,i){ c.push({name:'Футболка',size:s,code:String(1010+i),min:5}); });
  SIZES.forEach(function(s,i){ c.push({name:'Ветровка',size:s,code:String(1310+i),min:5}); });
  c.push({name:'Плащ',size:'Без размера',code:'1119',min:5});
  c.push({name:'Кепка',size:'Без размера',code:'1219',min:5});
  return c;
}
function newData(){ return {catalog:defaultCatalog(),stock:{},bags:{},log:[]}; }

/* ---------- state ---------- */
var S={users:[],me:null,viewId:null,D:null,rev:0,loading:false,tab:'stock',screen:null,seg:'items',q:'',eq:'',logF:'all',comment:'',bagType:'bag',bagCond:'n',bagNum:'',bagList:'stock',loginErr:'',pwErr:''};
var root=$('#root'), host=$('#sheet-host'), toastEl=$('#toast'), toastT=null, saveSt='';

function emailOf(l){ return String(l||'').trim().toLowerCase()+'@sklad.local'; }
function mapProfile(r){ return {id:r.id,login:r.login,role:r.role,blocked:!!r.blocked,mustChange:!!r.must_change,wh:r.wh_name}; }

function viewLoginName(){ var u=userById(S.viewId); return u?u.login:''; }
function saveLabel(){ return saveSt==='saving'?', сохраняется':saveSt==='saved'?', сохранено':saveSt==='error'?', не сохранено':''; }
function setSaveState(v){ saveSt=v; var el=$('#saveState'); if(el) el.textContent=saveLabel(); }

async function loadProfiles(){
  var r=await sb.from('profiles').select('*').order('created_at',{ascending:true});
  if(r.error) throw r.error;
  S.users=r.data.map(mapProfile);
}
async function loadData(id){
  var r=await sb.from('wh_data').select('data,rev').eq('user_id',id).maybeSingle();
  if(r.error) throw r.error;
  if(!r.data){
    var d=newData(), ins=await sb.from('wh_data').insert({user_id:id,data:d,rev:1});
    if(ins.error) throw ins.error;
    S.D=d; S.rev=1; return;
  }
  var dd=r.data.data;
  S.D=(dd&&Array.isArray(dd.catalog))?dd:newData();
  S.D.stock=S.D.stock||{}; S.D.bags=S.D.bags||{}; S.D.log=S.D.log||[];
  S.rev=r.data.rev;
}

/* сохранение: очередь + проверка версии (защита от затирания с другого устройства) */
var saveBusy=false, saveDirty=false;
function save(){ saveDirty=true; if(!saveBusy) flushSave(); return true; }
function idle(){ return new Promise(function(res){ (function w(){ if(!saveBusy) res(); else setTimeout(w,40); })(); }); }
async function flushSave(){
  saveBusy=true;
  try{
    while(saveDirty){
      saveDirty=false;
      var id=S.viewId, snap=JSON.parse(JSON.stringify(S.D)), rev=S.rev;
      setSaveState('saving');
      var r=await sb.from('wh_data').update({data:snap,rev:rev+1,updated_at:new Date().toISOString()}).eq('user_id',id).eq('rev',rev).select('rev');
      if(r.error){ setSaveState('error'); toast('Не удалось сохранить: '+r.error.message,'err'); saveBusy=false; return; }
      if(!r.data||!r.data.length){
        saveBusy=false; setSaveState('error');
        toast('Склад изменён на другом устройстве. Данные обновлены, повторите действие.','err');
        try{ await loadData(id); render(); }catch(e){}
        return;
      }
      S.rev=r.data[0].rev;
    }
    setSaveState('saved');
  }catch(e){ setSaveState('error'); toast('Нет связи с сервером. Изменения не сохранены.','err'); }
  saveBusy=false;
}

function itemLabel(it){ return (it.size&&it.size!=='Без размера')?it.name+' '+it.size:it.name; }
function byCode(code){ code=String(code||'').trim(); return S.D.catalog.filter(function(i){ return i.code===code; })[0]; }
function labelByCode(code){ var it=byCode(code); return it?itemLabel(it):String(code); }
function qty(code){ return S.D.stock[code]||{n:0,u:0}; }
function applyTheme(){ var t=ls.get('sklad_theme')||'auto', r=document.documentElement; if(t==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',t); }
function bagName(type){ return type==='auto'?'Автосумка':'Сумка'; }
function bagLabel(b){ return bagName(b.type)+' №'+b.num; }
function natSort(a,b){ return String(a).localeCompare(String(b),undefined,{numeric:true}); }

function totals(){
  var D=S.D, t={n:0,u:0,all:0,bagStock:0,bagIssued:0,bags:{bag:{n:0,u:0,iss:0},auto:{n:0,u:0,iss:0}}};
  D.catalog.forEach(function(it){ var q=qty(it.code); t.n+=q.n; t.u+=q.u; });
  t.all=t.n+t.u;
  Object.keys(D.bags).forEach(function(k){
    var b=D.bags[k], g=t.bags[b.type]; if(!g) return;
    if(b.status==='issued'){ g.iss++; t.bagIssued++; } else { g[b.cond]++; t.bagStock++; }
  });
  return t;
}
function lowItems(){ return S.D.catalog.filter(function(it){ var q=qty(it.code); return q.n+q.u<(+it.min||0); }); }

/* ---------- operations ---------- */
function applyLines(kind,lines,meta){
  var D=S.D, i, l, q;
  for(i=0;i<lines.length;i++){
    l=lines[i]; q=qty(l.code);
    if(q[l.cond]+l.delta<0) return {err:'Недостаточно: '+labelByCode(l.code)+' ('+COND[l.cond].toLowerCase()+'), на складе '+q[l.cond]};
  }
  var gid=uid(), ts=Date.now(), first=true;
  for(i=0;i<lines.length;i++){
    l=lines[i]; q=D.stock[l.code]||(D.stock[l.code]={n:0,u:0});
    var from=q[l.cond]; q[l.cond]=from+l.delta;
    var e={id:uid(),gid:gid,ts:ts,type:kind,code:l.code,label:labelByCode(l.code),cond:l.cond,from:from,to:q[l.cond],delta:l.delta,comment:meta.comment||''};
    if(meta.dest) e.dest=meta.dest;
    if(meta.reason) e.reason=meta.reason;
    if(meta.photo&&first) e.photo=meta.photo;
    D.log.unshift(e); first=false;
  }
  if(D.log.length>3000) D.log.length=3000;
  return {gid:gid};
}
function adjust(code,cond,d){
  var q=qty(code);
  if(q[cond]+d<0){ toast('Остаток не может быть меньше нуля','err'); return; }
  var r=applyLines('adjust',[{code:code,cond:cond,delta:d}],{comment:S.comment});
  if(r.err){ toast(r.err,'err'); return; }
  S.comment=''; var c=$('#cmt'); if(c) c.value='';
  save(); fillItems(); refreshUndo();
}
function lastUndoable(){ var L=S.D.log; for(var i=0;i<L.length;i++){ if(L[i].type!=='undo'&&!L[i].undone) return L[i]; } return null; }
function undoLast(){
  var D=S.D, first=lastUndoable();
  if(!first){ toast('Нет операций для отмены'); return; }
  var group=D.log.filter(function(e){ return e.gid===first.gid&&!e.undone&&e.type!=='undo'; });
  var i, e, q, b;
  for(i=0;i<group.length;i++){
    e=group[i];
    if(e.type==='bag_writeoff'){
      for(var w=0;w<e.keys.length;w++){ if(D.bags[e.keys[w]]){ toast('Нельзя отменить: номер '+D.bags[e.keys[w]].num+' уже снова есть в учёте','err'); return; } }
    } else if(e.type==='bag_receive'){
      for(var k=0;k<e.keys.length;k++){ b=D.bags[e.keys[k]]; if(!b||b.status!=='stock'){ toast('Нельзя отменить: часть принятых сумок уже выдана','err'); return; } }
    } else if(e.bagKey){
      b=D.bags[e.bagKey]; if(!b||b.status!==e.next.status){ toast('Нельзя отменить: состояние сумки уже изменилось','err'); return; }
    } else {
      q=qty(e.code); if(q[e.cond]-e.delta<0){ toast('Нельзя отменить: остаток стал бы меньше нуля','err'); return; }
    }
  }
  var gid=uid(), ts=Date.now(), msg='';
  group.forEach(function(e){
    e.undone=true;
    if(e.type==='bag_writeoff'){
      e.items.forEach(function(it){ var bg=it.bag; bg.hist=bg.hist||[]; bg.hist.push({ts:ts,act:'undo',cond:bg.cond}); D.bags[it.key]=bg; });
      D.log.unshift({id:uid(),gid:gid,ts:ts,type:'undo',label:e.label,note:'Отмена: '+TYPE[e.type]});
      msg='Отменено: списание сумок. Номера вернулись в список ('+e.items.length+' шт.)';
    } else if(e.type==='bag_receive'){
      e.keys.forEach(function(k){ delete D.bags[k]; });
      D.log.unshift({id:uid(),gid:gid,ts:ts,type:'undo',label:e.label,note:'Отмена: '+TYPE[e.type]});
      msg='Отменено: приёмка сумок. Принятые номера убраны со склада';
    } else if(e.bagKey){
      var bb=D.bags[e.bagKey];
      if(!e.prev){ delete D.bags[e.bagKey]; msg='Отменено: '+e.label+'. Запись о сумке удалена'; }
      else { bb.status=e.prev.status; bb.cond=e.prev.cond; bb.hist.push({ts:ts,act:'undo',cond:bb.cond}); msg='Отменено: '+TYPE[e.type].toLowerCase()+' ('+e.label+'). '+(bb.status==='stock'?'Снова на складе':'Снова выдана'); }
      D.log.unshift({id:uid(),gid:gid,ts:ts,type:'undo',label:e.label,note:'Отмена: '+TYPE[e.type]});
    } else {
      var qq=D.stock[e.code]||(D.stock[e.code]={n:0,u:0}), cur=qq[e.cond];
      qq[e.cond]=cur-e.delta;
      D.log.unshift({id:uid(),gid:gid,ts:ts,type:'undo',code:e.code,label:e.label,cond:e.cond,from:cur,to:qq[e.cond],delta:-e.delta,comment:'Отмена: '+TYPE[e.type]});
      msg='Отменено: '+e.label+', '+COND[e.cond].toLowerCase()+'. Остаток вернулся к '+qq[e.cond];
    }
  });
  if(group.length>1) msg='Отменено: '+TYPE[first.type].toLowerCase()+' ('+group.length+' поз.). Остатки вернулись к прежним значениям';
  save(); toast(msg); render();
}
function refreshUndo(){ var b=$('#undoBtn'); if(b) b.disabled=!lastUndoable(); }

/* bags */
function bagOp(kind){
  var D=S.D, num=(S.bagNum||'').trim();
  if(!num){ toast('Введите номер сумки','err'); return; }
  var key=S.bagType+':'+num, b=D.bags[key], tname=bagName(S.bagType), ts=Date.now();
  var label=tname+' №'+num, gid=uid(), e;
  if(kind==='issue'){
    if(!b){ toast(label+': такой сумки нет на складе','err'); return; }
    if(b.status!=='stock'){ toast(label+' уже выдана','err'); return; }
    var prev={status:b.status,cond:b.cond};
    b.status='issued'; b.hist.push({ts:ts,act:'issue',cond:b.cond});
    e={id:uid(),gid:gid,ts:ts,type:'bag_issue',bagKey:key,label:label,cond:b.cond,prev:prev,next:{status:'issued',cond:b.cond},comment:S.comment};
    D.log.unshift(e); toast('Выдана: '+label+' ('+BAGCOND[b.cond].toLowerCase()+')');
  } else {
    if(b&&b.status==='stock'){ toast(label+' уже на складе','err'); return; }
    var prev2=b?{status:b.status,cond:b.cond}:null;
    if(b){ b.status='stock'; b.cond=S.bagCond; b.hist.push({ts:ts,act:'return',cond:b.cond}); }
    else { D.bags[key]={type:S.bagType,num:num,cond:S.bagCond,status:'stock',hist:[{ts:ts,act:'return',cond:S.bagCond}]}; }
    e={id:uid(),gid:gid,ts:ts,type:'bag_return',bagKey:key,label:label,cond:S.bagCond,prev:prev2,next:{status:'stock',cond:S.bagCond},comment:S.comment,note:b?'':'Новая запись, раньше на складе не числилась'};
    D.log.unshift(e); toast('Принята: '+label+' ('+BAGCOND[S.bagCond].toLowerCase()+')');
  }
  S.bagNum=''; S.comment='';
  save(); render();
}
function bagRangeSheet(){
  var seg=function(act,opts,cur){ return '<div class="seg" style="margin-bottom:10px">'+opts.map(function(o){ return '<button data-act="'+act+'" data-v="'+o[0]+'" aria-pressed="'+(o[0]===cur)+'">'+o[1]+'</button>'; }).join('')+'</div>'; };
  openSheet('Принять сумки',
    seg('rg-type',[['bag','Сумка'],['auto','Автосумка']],S.bagType)+
    seg('rg-cond',[['n','Новые'],['u','Б/у']],'n')+
    '<label class="f">Номера сумок<textarea id="rg-nums" rows="3" placeholder="10, 11, 12, 13 или 20-25" autocomplete="off" style="font:inherit;resize:vertical"></textarea></label>'+
    '<p class="hint">Через запятую, например: 10, 11, 12, 13. Диапазон через дефис: 20-25. Номера, которые уже есть в этом типе, пропускаются. За один раз до 500 сумок.</p><p class="err" id="rg-err"></p>',
    '<button class="btn" data-act="range-go">Принять</button>');
}
function rgPick(act,v){
  document.querySelectorAll('[data-act="'+act+'"]').forEach(function(b){ b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===v)); });
}
function rgVal(act){ var b=document.querySelector('[data-act="'+act+'"][aria-pressed="true"]'); return b?b.getAttribute('data-v'):''; }
function parseBagNums(raw){
  var parts=String(raw||'').split(/[,;\s]+/).filter(Boolean), nums=[], seen={};
  for(var i=0;i<parts.length;i++){
    var p=parts[i], m=p.match(/^(\d+)[-–—](\d+)$/);
    if(m){
      var a=parseInt(m[1],10), z=parseInt(m[2],10);
      if(z<a) return {err:'Диапазон «'+p+'»: второй номер меньше первого.'};
      if(z-a>=500) return {err:'Слишком большой диапазон «'+p+'», максимум 500 номеров.'};
      for(var n=a;n<=z;n++){ var s=String(n); if(!seen[s]){ seen[s]=1; nums.push(s); } }
    } else if(/[-–—]/.test(p)&&/^\d/.test(p)){
      return {err:'Не понятен диапазон «'+p+'». Пример: 20-25.'};
    } else {
      if(!seen[p]){ seen[p]=1; nums.push(p); }
    }
    if(nums.length>500) return {err:'Слишком много номеров, максимум 500 за раз.'};
  }
  return {nums:nums};
}
function rangeGo(){
  var type=rgVal('rg-type')||S.bagType, cond=rgVal('rg-cond')||'n', er=$('#rg-err');
  var r=parseBagNums($('#rg-nums').value);
  if(r.err){ er.textContent=r.err; return; }
  if(!r.nums.length){ er.textContent='Впишите номера сумок, например: 10, 11, 12, 13.'; return; }
  var D=S.D, ts=Date.now(), keys=[];
  r.nums.forEach(function(num){
    var k=type+':'+num; if(D.bags[k]) return;
    D.bags[k]={type:type,num:num,cond:cond,status:'stock',hist:[{ts:ts,act:'receive',cond:cond}]}; keys.push(k);
  });
  if(!keys.length){ er.textContent='Все эти номера уже есть на складе.'; return; }
  var raw=$('#rg-nums').value.trim().replace(/\s*[,;\s]\s*/g,', ').replace(/(, )+/g,', ');
  if(raw.length>80) raw=raw.slice(0,77)+'…';
  D.log.unshift({id:uid(),gid:uid(),ts:ts,type:'bag_receive',keys:keys,cond:cond,label:bagName(type)+' №'+raw,note:'Принято '+keys.length+' шт., '+BAGCOND[cond].toLowerCase()+(keys.length<r.nums.length?' (часть номеров уже была: '+(r.nums.length-keys.length)+')':''),comment:S.comment});
  S.comment=''; S.bagType=type; save(); closeSheet(); toast('Принято сумок: '+keys.length); render();
}
/* списание сумок: номера убираются из списка, запись остаётся в журнале */
var BW=null, BW_REASONS=['Износ','Брак','Потеря','Повреждение','Ошибка ввода'];
function openBagWriteoff(pre){

function bwBody(){

    '<label class="f">Номера сумок<textarea id="bw-nums" rows="3" placeholder="10, 11, 12 или 20-25" autocomplete="off" style="font:inherit;resize:vertical">'+esc(BW.nums)+'</textarea></label>'+
    '<label class="f">Причина<select id="bw-reason">'+BW_REASONS.map(function(r){ return '<option'+(BW.reason===r?' selected':'')+'>'+r+'</option>'; }).join('')+'</select></label>'+
    '<label class="f">Фото (необязательно)<input type="file" id="bw-photo" accept="image/*"></label>'+

function bwFoot(){ return '<button class="btn sec" data-act="close-sheet">Отмена</button><button class="btn danger" data-act="bw-go">Списать</button>'; }
function bwRerender(){ setSheet(bwBody()); }
function bwGo(){
  var er=$('#bw-err'), D=S.D, r=parseBagNums(BW.nums);
  if(r.err){ er.textContent=r.err; return; }
  if(!r.nums.length){ er.textContent='Впишите номера сумок, например: 10, 11, 12.'; return; }
  var items=[], missing=[], issued=0;
  r.nums.forEach(function(num){
    var key=BW.type+':'+num, b=D.bags[key];
    if(!b){ missing.push(num); return; }

function openScanner(onCode){

      rows.forEach(function(r){
        var name='',size='',code='';
        Object.keys(r).forEach(function(k){
          var kk=k.toLowerCase().trim();

          else if(kk==='barcode'||kk.indexOf('штрих')===0||kk==='код') code=String(r[k]).trim();
        });

        var ex=CE.filter(function(c){ return c.code===code; })[0];
        if(ex){ ex.name=name; ex.size=size||ex.size; upd++; } else { CE.push({name:name,size:size||'Без размера',code:code,min:5}); added++; }

  };

function saveFile(filename,data){

function exportXlsx(kind){

  if(typeof XLSX==='undefined'){ toast('Библиотека Excel не загрузилась. Проверьте интернет.','err'); return; }
  var r=await sb.from('wh_data').select('user_id,data');
  if(r.error){ toast('Не удалось получить данные складов','err'); return; }
  var map={}; r.data.forEach(function(row){ map[row.user_id]=row.data; });
  var wb=XLSX.utils.book_new();
  S.users.forEach(function(u,i){
    var d=(u.id===S.viewId)?S.D:map[u.id];
    if(!d||!Array.isArray(d.catalog)) d=newData();
    d.bags=d.bags||{}; d.stock=d.stock||{};
    var aoa=stockAOA(d); aoa.push([]); aoa.push(['Сумки']); bagsAOA(d).forEach(function(x){ aoa.push(x); });
    XLSX.utils.book_append_sheet(wb,mkSheet(aoa),safeSheetName(u.wh,i));
  });
  saveFile('Все_склады_'+new Date().toISOString().slice(0,10)+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}));
}

function groupItems(q){
  q=(q||'').trim().toLowerCase(); var groups=[],map={};
  S.D.catalog.forEach(function(it){
    if(q&&(it.name+' '+it.size+' '+it.code).toLowerCase().indexOf(q)<0) return;
    if(!map[it.name]){ map[it.name]={name:it.name,items:[]}; groups.push(map[it.name]); }
    map[it.name].items.push(it);
  });
  return groups;
}
function fillStock(){
  var el=$('#stockList'); if(!el) return;

    return '<section class="grp"><h3>'+esc(gr.name)+'</h3><div class="tbl"><div class="trow thead"><span>Размер</span><span>Новый</span><span>Б/у</span><span>Всего</span></div>'+

function logView(){

  var list=S.D.log.filter(function(e){ return S.logF==='all'||(S.logF==='bag'?e.type.indexOf('bag_')===0:(S.logF==='writeoff'?(e.type==='writeoff'||e.type==='bag_writeoff'):e.type===S.logF)); });
  if(!list.length) return h+'<div class="empty">Записей пока нет</div>';
  return h+list.slice(0,300).map(function(e){
    var l1=esc(TYPE[e.type])+' · '+esc(e.label||'')+(e.cond&&!e.keys?' · '+(e.type.indexOf('bag_')===0?BAGCOND[e.cond]:COND[e.cond]):'')+(e.undone?'<span class="badge">отменено</span>':'');
    var l2='';
    if(e.from!==undefined) l2='Было '+e.from+' → стало '+e.to+' <span class="'+(e.delta>0?'pos':'neg')+'">('+(e.delta>0?'+':'')+e.delta+')</span>';
    else if(e.type==='bag_issue') l2='Выдана со склада';
    else if(e.type==='bag_return') l2='Возвращена на склад'+(e.note?'. '+esc(e.note):'');
    else if(e.note) l2=esc(e.note);
    var l3=[fmtDT(e.ts)];
    if(e.dest) l3.push('Куда: '+esc(e.dest));
    if(e.reason) l3.push('Причина: '+esc(e.reason));
    if(e.comment) l3.push('Комментарий: '+esc(e.comment));
    return '<div class="le'+(e.undone?' undone':'')+'"><div class="l1">'+l1+'</div>'+(l2?'<div class="l2">'+l2+'</div>':'')+'<div class="l3">'+l3.join(' · ')+'</div>'+(e.photo?'<img src="'+e.photo+'" alt="Фото к списанию" data-act="photo" data-id="'+e.id+'" style="cursor:zoom-in">':'')+'</div>';
  }).join('')+(list.length>300?'<p class="hint">Показаны последние 300 записей. В выгрузке Excel есть все перемещения и списания.</p>':'');
}

  });
  return h+'</div><p class="hint">Пользователей нельзя удалить, только заблокировать. История склада сохраняется.</p>';
}

/* ---------- actions ---------- */
function errText(e){ return (e&&e.message)?e.message:'Ошибка. Попробуйте ещё раз.'; }
function pwErrText(e){
  var m=(e&&e.message)||'';
  if(/different/i.test(m)) return 'Новый пароль должен отличаться от прежнего.';
  if(/least|short|weak/i.test(m)) return 'Пароль слишком короткий или простой. Нужно не меньше 6 символов.';
  return 'Не удалось сменить пароль: '+m;
}
async function rpc(name,args){ var r=await sb.rpc(name,args||{}); if(r.error) throw r.error; return r.data; }

async function doLogin(){
  var l=($('#lg-login').value||'').trim(), p=$('#lg-pass').value||'';
  if(!l||!p){ S.loginErr='Введите логин и пароль.'; render(); return; }
  S.loading=true; render();
  try{
    var r=await sb.auth.signInWithPassword({email:emailOf(l),password:p});
    if(r.error){ S.loading=false; S.loginErr='Неверный логин или пароль.'; render(); return; }
    await enterSession(r.data.user.id);
  }catch(e){ S.loading=false; S.loginErr='Нет связи с сервером. Проверьте интернет.'; render(); }
}
async function enterSession(uid){
  try{
    var r=await sb.from('profiles').select('*').eq('id',uid).maybeSingle();
    if(r.error||!r.data){ await sb.auth.signOut(); S.loading=false; S.me=null; S.loginErr='Профиль не найден. Обратитесь к администратору.'; render(); return; }
    var me=mapProfile(r.data);
    if(me.blocked){ await sb.auth.signOut(); S.loading=false; S.me=null; S.loginErr='Пользователь заблокирован. Обратитесь к администратору.'; render(); return; }
    S.me=me; S.viewId=me.id; S.users=[me]; S.tab='stock'; S.screen=null; S.loginErr='';
    if(me.mustChange){ S.loading=false; render(); return; }
    await bootData();
  }catch(e){ S.loading=false; S.me=null; S.loginErr='Нет связи с сервером. Проверьте интернет.'; render(); }
}
async function bootData(){
  S.loading=true; render();
  try{ await loadProfiles(); var m=userById(S.me.id); if(m) S.me=m; await loadData(S.viewId); }
  catch(e){ S.loading=false; S.D=null; render(); return; }
  S.loading=false; render();
}
async function doLogout(){
  await idle();
  try{ await sb.auth.signOut(); }catch(e){}
  S.me=null; S.viewId=null; S.D=null; S.users=[]; S.screen=null; S.tab='stock'; S.loading=false; S.loginErr=''; render();
}
async function openUserWh(id){
  await idle(); S.loading=true; render();
  try{ await loadData(id); S.viewId=id; S.tab='stock'; S.screen=null; }
  catch(e){ toast('Не удалось открыть склад: '+errText(e),'err'); }
  S.loading=false; render();
}
async function doRefresh(){
  await idle();
  try{ await loadProfiles(); var m=userById(S.me.id); if(m) S.me=m; await loadData(S.viewId); render(); toast('Данные обновлены'); }
  catch(e){ toast('Не удалось обновить данные','err'); }
}
async function doSetPw(){
  var a=$('#pw1').value, b=$('#pw2').value;
  if(a.length<6){ S.pwErr='Пароль должен быть не короче 6 символов.'; render(); return; }
  if(a!==b){ S.pwErr='Пароли не совпадают.'; render(); return; }
  S.loading=true; render();
  try{
    var r=await sb.auth.updateUser({password:a});
    if(r.error){ S.loading=false; S.pwErr=pwErrText(r.error); render(); return; }
    await rpc('finish_password_change');
    S.pwErr=''; S.me.mustChange=false; toast('Пароль сохранён');
    await bootData();
  }catch(e){ S.loading=false; S.pwErr=errText(e); render(); }
}
async function doChangePw(){
  var p1=$('#st-pw1').value, p2=$('#st-pw2').value, er=$('#st-pwerr');
  if(p1.length<6){ er.textContent='Пароль должен быть не короче 6 символов.'; return; }
  if(p1!==p2){ er.textContent='Пароли не совпадают.'; return; }
  var r=await sb.auth.updateUser({password:p1});
  if(r.error){ er.textContent=pwErrText(r.error); return; }
  toast('Пароль изменён'); render();
}
async function doRename(id,name){
  if(!name){ toast('Введите название','err'); return; }
  try{ await rpc('set_wh_name',{p_target:id,p_name:name}); await loadProfiles(); var m=userById(S.me.id); if(m) S.me=m; toast('Название сохранено'); render(); }
  catch(e){ toast(errText(e),'err'); }
}
var formBusy=false;
async function submitForm(){
  if(formBusy||!FORM) return; formBusy=true;
  var vals={}; FORM.fields.forEach(function(fl){ vals[fl.id]=($('#ff-'+fl.id).value||'').trim(); });
  var res; try{ res=await FORM(vals); }catch(e){ res=errText(e); }
  formBusy=false;
  var er=$('#ff-err'); if(res){ if(er) er.textContent=res; } else closeSheet();
}
function newUserForm(){
  formSheet('Новый пользователь',[{id:'login',label:'Логин (латиница и цифры)'},{id:'pass',label:'Временный пароль (от 6 символов)'},{id:'wh',label:'Название склада',value:'Склад'}],'Создать',async function(v){
    v.login=v.login.toLowerCase();
    if(!/^[a-z0-9_.-]{3,}$/.test(v.login)) return 'Логин: от 3 символов, латиница, цифры, точка, дефис.';
    if(v.pass.length<6) return 'Пароль должен быть не короче 6 символов.';
    await rpc('admin_create_user',{p_login:v.login,p_password:v.pass,p_wh:v.wh||'Склад'});
    await loadProfiles(); toast('Пользователь создан. При первом входе он сменит пароль.'); render(); return '';
  });
}
function resetForm(id){
  var u=userById(id); if(!u) return;
  formSheet('Сбросить пароль: '+u.login,[{id:'pass',label:'Временный пароль (от 6 символов)'}],'Сбросить',async function(v){
    if(v.pass.length<6) return 'Пароль должен быть не короче 6 символов.';
    await rpc('admin_reset_password',{p_target:id,p_password:v.pass});
    await loadProfiles(); toast('Пароль сброшен. При входе потребуется новый.'); render(); return '';
  });
}
function renameForm(id){
  var u=userById(id); if(!u) return;
  formSheet('Название склада: '+u.login,[{id:'wh',label:'Название склада',value:u.wh}],'Сохранить',async function(v){
    if(!v.wh) return 'Введите название.';
    await rpc('set_wh_name',{p_target:id,p_name:v.wh});
    await loadProfiles(); var m=userById(S.me.id); if(m) S.me=m; toast('Название сохранено'); render(); return '';
  });
}
async function toggleBlock(id){
  var u=userById(id); if(!u) return;
  try{ await rpc('admin_set_blocked',{p_target:id,p_blocked:!u.blocked}); await loadProfiles(); toast(u.blocked?'Пользователь разблокирован':'Пользователь заблокирован'); render(); }
  catch(e){ toast(errText(e),'err'); }
}

function handleAct(act,t,ev){
  var d=t.dataset;
  switch(act){
    case 'sheet-back': if(ev.target===t) closeSheet(); break;
    case 'close-sheet': closeSheet(); break;
    case 'login': doLogin(); break;
    case 'logout': doLogout(); break;
    case 'retry': bootData(); break;
    case 'setpw': doSetPw(); break;
    case 'tab': S.tab=d.tab; render(); window.scrollTo(0,0); break;
    case 'go': S.screen=d.screen; render(); window.scrollTo(0,0); break;
    case 'back': S.screen=(S.screen==='admin'?'settings':null); render(); break;
    case 'back-own': openUserWh(S.me.id); break;
    case 'seg-stock': S.seg=d.v; render(); break;
    case 'export': exportXlsx(d.kind); break;
    case 'bag-hist': bagHistory(d.key); break;
    case 'adj': adjust(d.code,d.cond,parseInt(d.d,10)); break;
    case 'undo': undoLast(); break;
    case 'refresh': doRefresh(); break;
    case 'scan-search': openScanner(function(code){ S.eq=String(code); render(); var it=byCode(code); toast(it?'Найдено: '+itemLabel(it):'Штрихкод '+code+' не найден в справочнике',it?'':'err'); }); break;
    case 'op': openOp(d.kind); break;
    case 'op-cond': OP.cond=d.v; opRerender(); break;
    case 'op-add': opAdd(); break;
    case 'op-del': OP.lines.splice(parseInt(d.i,10),1); opRerender(); break;
    case 'op-go': opGo(); break;
    case 'op-scan': openScanner(function(code){ var it=byCode(code); if(!it){ toast('Штрихкод '+code+' не найден в справочнике','err'); } else { OP.item=it.code; OP.code=code; } openSheet(opTitle(OP.kind),opBody(),opFoot()); }); break;
    case 'inv': openInv(); break;
    case 'inv-next': INV.step=2; setSheet(invBody(),invFoot()); break;
    case 'inv-back': INV.step=1; setSheet(invBody(),invFoot()); break;
    case 'inv-apply': invApply(); break;
    case 'bag-type': S.bagType=d.v; render(); break;
    case 'bag-cond': S.bagCond=d.v; render(); break;
    case 'bag-list': S.bagList=d.v; render(); break;
    case 'bag-issue': bagOp('issue'); break;
    case 'bag-return': bagOp('return'); break;
    case 'bag-scan': openScanner(function(code){ S.bagNum=String(code); render(); }); break;
    case 'bag-history': { var n=(S.bagNum||'').trim(); if(!n){ toast('Введите номер сумки','err'); break; } bagHistory(S.bagType+':'+n); break; }
    case 'bag-range': bagRangeSheet(); break;
    case 'bag-wo': openBagWriteoff({type:S.bagType,nums:S.bagNum}); break;
    case 'bag-wo-one': { var kk=String(d.key), ix=kk.indexOf(':'); openBagWriteoff({type:kk.slice(0,ix),nums:kk.slice(ix+1)}); break; }
    case 'wo-bags': openBagWriteoff({type:S.bagType,nums:S.bagNum}); break;
    case 'wo-equip': openOp('writeoff'); break;
    case 'bw-type': BW.type=d.v; bwRerender(); break;
    case 'bw-go': bwGo(); break;
    case 'range-go': rangeGo(); break;
    case 'rg-type': case 'rg-cond': rgPick(act,d.v); break;
    case 'logf': S.logF=d.v; render(); break;
    case 'photo': { var en=S.D.log.filter(function(e){ return e.id===d.id; })[0]; if(en&&en.photo) openSheet('Фото',('<img src="'+en.photo+'" alt="Фото" style="width:100%;border-radius:12px">'),''); break; }
    case 'save-wh': doRename(S.viewId,($('#st-wh').value||'').trim()); break;
    case 'theme': ls.set('sklad_theme',d.v); render(); break;
    case 'savepw': doChangePw(); break;
    case 'cat-open': openCatalog(); break;
    case 'cat-add': CE.push({name:'',size:'Без размера',code:'',min:5}); setSheet(catBody()); break;
    case 'cat-del': {
      var ci=parseInt(d.i,10), c=CE[ci], q=c&&c.code?qty(c.code):null;
      if(q&&q.n+q.u>0){ $('#ce-err').textContent='Нельзя удалить: на складе есть остаток ('+(q.n+q.u)+'). Сначала спишите.'; break; }
      CE.splice(ci,1); setSheet(catBody()); break;
    }
    case 'cat-save': catSave(); break;
    case 'backup': {
      var payload={v:1,warehouse:whName(),exported:new Date().toISOString(),data:S.D};
      saveFile('Склад_копия_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(payload)); break;
    }
    case 'clear': confirmSheet('Остатки, сумки и журнал этого склада будут удалены. Справочник сохранится. Продолжить?','Очистить',function(){ var cat=S.D.catalog; S.D={catalog:cat,stock:{},bags:{},log:[]}; save(); closeSheet(); toast('Склад очищен'); render(); },true); break;
    case 'confirm-ok': { var f=CONFIRM; CONFIRM=null; if(f) f(); break; }
    case 'form-ok': submitForm(); break;
    case 'u-new': newUserForm(); break;
    case 'u-open': openUserWh(d.id); break;
    case 'u-block': toggleBlock(d.id); break;
    case 'u-reset': resetForm(d.id); break;
    case 'u-rename': renameForm(d.id); break;
    case 'all-export': exportAll(); break;
  }
}

document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]'); if(!t) return;
  handleAct(t.dataset.act,t,ev);
});
document.addEventListener('input',function(ev){
  var t=ev.target, id=t.id, d=t.dataset;
  if(id==='stq'){ S.q=t.value; fillStock(); }
  else if(id==='edq'){ S.eq=t.value; fillItems(); }
  else if(id==='cmt'){ S.comment=t.value; }
  else if(id==='bagNum'){ S.bagNum=t.value; }
  else if(id==='op-dest'){ OP.dest=t.value; }
  else if(id==='op-cmt'){ S.comment=t.value; }
  else if(id==='bw-nums'){ BW.nums=t.value; }
  else if(id==='bw-cmt'){ S.comment=t.value; }
  else if(id==='op-qty'){ OP.qty=t.value; }
  else if(id==='op-code'){
    OP.code=t.value; var it=byCode(t.value);
    if(it){ OP.item=it.code; var sel=$('#op-item'); if(sel) sel.value=it.code; var av=$('#op-avail'); if(av) av.textContent=availText(); }
  }
  else if(d.inv!==undefined){ INV.vals[d.inv]=t.value; }
  else if(d.ce!==undefined){ var p=d.ce.split('|'); CE[+p[0]][p[1]]=t.value; }
});
document.addEventListener('change',function(ev){
  var t=ev.target, id=t.id;
  if(id==='op-item'){ OP.item=t.value; var av=$('#op-avail'); if(av) av.textContent=availText(); }
  else if(id==='op-reason'){ OP.reason=t.value; }
  else if(id==='bw-reason'){ BW.reason=t.value; }
  else if(id==='bw-photo'){ if(t.files&&t.files[0]) readPhoto(t.files[0]).then(function(p){ BW.photo=p; if(!p) toast('Не удалось прочитать фото','err'); bwRerender(); }); }
  else if(id==='op-photo'){ if(t.files&&t.files[0]) readPhoto(t.files[0]).then(function(p){ OP.photo=p; if(!p) toast('Не удалось прочитать фото','err'); opRerender(); }); }
  else if(id==='cat-xlsx'){ if(t.files&&t.files[0]) importXlsx(t.files[0]); }
  else if(id==='st-restore'){
    var f=t.files&&t.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var o=JSON.parse(fr.result), d=o.data||o;
        if(!d||!Array.isArray(d.catalog)||typeof d.stock!=='object'||typeof d.bags!=='object'||!Array.isArray(d.log)) throw 0;
        confirmSheet('Текущие данные этого склада будут заменены данными из файла. Продолжить?','Загрузить',function(){ S.D=d; save(); closeSheet(); toast('Данные загружены из файла'); render(); },true);
      }catch(e){ toast('Файл не похож на резервную копию склада','err'); }
    };
    fr.readAsText(f);
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'){
    var id=ev.target.id;
    if(id==='lg-login'||id==='lg-pass'){ doLogin(); }
    else if(id==='pw1'||id==='pw2'){ handleAct('setpw',ev.target,ev); }
    else if(id==='bagNum'){ ev.preventDefault(); }
  }
  if(ev.key==='Escape'&&host.innerHTML) closeSheet();
});

/* ---------- start ---------- */
applyTheme();
(async function init(){
  if(!sb){ render(); return; }
  S.loading=true; render();
  try{
    var r=await sb.auth.getSession();
    if(r.data&&r.data.session){ await enterSession(r.data.session.user.id); return; }
  }catch(e){}
  S.loading=false; render();
})();
})();
</script>
</body>
</html>
